name: macOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Release build (Apple Silicon)
        run: |
          swift build -c release --arch arm64
          lipo -archs "$(swift build -c release --arch arm64 --show-bin-path)/NestorRunnerManager"
      - name: Signing configuration (ad hoc; hardened runtime, no get-task-allow)
        run: |
          ../../scripts/sign-macos.sh --identity - --kind app --identifier fr.kocoa.nestor.runner-manager \
            "$(swift build -c release --arch arm64 --show-bin-path)/NestorRunnerManager"

  core:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Test
        run: cargo test
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Signing configuration (ad hoc; hardened runtime, no get-task-allow)
        run: |
          cargo build --release --bin nestor-runner-service
          ../scripts/sign-macos.sh --identity - --kind service --identifier fr.kocoa.nestor.runner-service \
            target/release/nestor-runner-service
