[package]
name = "nestor-runner-core"
version = "0.1.0"
edition = "2021"
description = "Shared core of Nestor Runner Manager: admission regulation, runner supervision, persistence and the local IPC service."
publish = false

[lib]
name = "nestor_runner_core"
path = "src/lib.rs"

[[bin]]
name = "nestor-runner-service"
path = "src/bin/nestor-runner-service.rs"

[features]
# Development only (M1): accepts --allow-unsigned-clients. Refused at compile time in a release
# build; scripts/release-service.sh refuses to build with it.
dev-unsigned = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tempfile = "3"
